<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d1a" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge with Gradient Border -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="84" height="84" rx="22" fill="url(#innerGlow)" />

  <!-- Four-Leaf Lucky Clover / Star Icon -->
  <g transform="translate(50, 50)" filter="url(#glow)">
    <!-- Clover Petals -->
    <circle cx="0" cy="-14" r="11" fill="#818cf8" opacity="0.9" />
    <circle cx="14" cy="0" r="11" fill="#a855f7" opacity="0.9" />
    <circle cx="0" cy="14" r="11" fill="#38bdf8" opacity="0.9" />
    <circle cx="-14" cy="0" r="11" fill="#c084fc" opacity="0.9" />
    
    <!-- Central Golden Sparkle -->
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <!-- Diagonal sparkle accents -->
    <path d="M-3,-3 L0,-18 L3,-3 L18,0 L3,3 L0,18 L-3,3 L-18,0 Z" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
